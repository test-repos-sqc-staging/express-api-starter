name: SonarQube Cloud Scan

on:
  push:
    branches: [main, test]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  SCANNER_VERSION: 7.2.0.5079

jobs:
  sonar:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install SonarScanner (no bundled JRE)
        run: |
          curl -sSLo scanner.zip "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${SCANNER_VERSION}.zip"
          unzip -q scanner.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/sonar-scanner-${SCANNER_VERSION}/bin" >> "$GITHUB_PATH"

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          sonar-scanner \
            -Dsonar.organization=test-repos-sqc-staging \
            -Dsonar.projectKey=test-repos-sqc-staging_express-api-starter \
            -Dsonar.sources=src \
            -Dsonar.tests=test \
            -Dsonar.scanner.skipJreProvisioning=true \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300
